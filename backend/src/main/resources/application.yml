spring:
  application:
    name: centro-cinofilo-backend
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cinofilo}
    username: ${DB_USER:cinofilo}
    password: ${DB_PASSWORD:cinofilo}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-description: "Initial baseline"
    baseline-version: 0
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

# JWT — JWT_SECRET is mandatory, no default. Application refuses to start if missing or too short.
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}

logging:
  level:
    root: INFO
    it.cinofilo: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

app:
  base-url: ${APP_BASE_URL:http://localhost:4200}
  cors:
    # Supports comma-separated values via env var: CORS_ALLOWED_ORIGINS=https://a.com,https://b.com
    # In production set CORS_ALLOWED_ORIGINS to the real frontend domain.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
