name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Verify tag descends from main (vedi VERSIONING.md)
        run: |
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::Il tag ${{ github.ref_name }} punta a un commit che non e' un antenato di 'main'. I tag di release vanno creati solo su commit gia' mergiati in main (vedi VERSIONING.md)."
            exit 1
          fi
          echo "OK: il tag discende da main."

      - name: Verify release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::La release $TAG esiste gia' su GitHub. I tag di versione sono immutabili: non e' possibile ripubblicare la stessa versione con contenuto diverso (vedi DOCKER_IMAGES.md). Se serve una correzione, crea una nuova versione (es. patch)."
            exit 1
          fi
          echo "OK: nessuna release preesistente per $TAG."

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend version consistency (pom.xml)
        run: |
          POM_VERSION=$(mvn -q -f backend/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$POM_VERSION" != "${{ steps.version.outputs.value }}" ]; then
            echo "::error::La versione in backend/pom.xml ($POM_VERSION) non corrisponde al tag ${{ github.ref_name }} (attesa ${{ steps.version.outputs.value }}). Aggiorna pom.xml prima di taggare (vedi RELEASE_PROCESS.md)."
            exit 1
          fi
          echo "OK: backend/pom.xml e' allineato a ${{ steps.version.outputs.value }}."

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify frontend version consistency (package.json)
        run: |
          PKG_VERSION=$(node -p "require('./frontend/package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.value }}" ]; then
            echo "::error::La versione in frontend/package.json ($PKG_VERSION) non corrisponde al tag ${{ github.ref_name }} (attesa ${{ steps.version.outputs.value }}). Aggiorna package.json prima di taggare (vedi RELEASE_PROCESS.md)."
            exit 1
          fi
          echo "OK: frontend/package.json e' allineato a ${{ steps.version.outputs.value }}."

  build-and-publish:
    name: Build and publish release images
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        uses: ./.github/actions/publish-image
        with:
          image: ghcr.io/${{ github.repository }}/backend
          context: backend
          dockerfile: backend/Dockerfile
          cache-scope: backend
          tags: |
            type=raw,value=v${{ needs.verify-tag.outputs.version }}
            type=raw,value=latest

      - name: Publish frontend image
        uses: ./.github/actions/publish-image
        with:
          image: ghcr.io/${{ github.repository }}/frontend
          context: frontend
          dockerfile: frontend/Dockerfile
          cache-scope: frontend
          tags: |
            type=raw,value=v${{ needs.verify-tag.outputs.version }}
            type=raw,value=latest

  github-release:
    name: Publish GitHub Release
    needs: [verify-tag, build-and-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release (release notes automatiche)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
