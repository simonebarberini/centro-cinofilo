spring:
  application:
    name: centro-cinofilo-backend-dev
  
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  flyway:
    enabled: true
    clean-disabled: false
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    it.cinofilo: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# JWT Configuration for DEV
jwt:
  secret: dev-secret-key-minimum-256-bits-for-hs256-algorithm-change-in-production
  expiration-ms: 28800000
