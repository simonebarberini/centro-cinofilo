<div class="min-h-screen flex items-center justify-center bg-base-200 px-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">
      <div class="text-center mb-4">
        <h2 class="text-2xl font-bold text-primary">🐾 Centro Cinofilo</h2>
        <p class="text-sm text-base-content/60 mt-1">Accedi al tuo account</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <div class="form-control w-full">
          <label class="label" for="tenantSlug">
            <span class="label-text font-medium">Centro</span>
          </label>
          <input
            id="tenantSlug"
            type="text"
            formControlName="tenantSlug"
            placeholder="slug del centro"
            autocomplete="organization"
            class="input input-bordered w-full"
          />
        </div>

        <div class="form-control w-full">
          <label class="label" for="username">
            <span class="label-text font-medium">Username</span>
          </label>
          <input
            id="username"
            type="text"
            formControlName="username"
            placeholder="il tuo username"
            autocomplete="username"
            class="input input-bordered w-full"
          />
        </div>

        <div class="form-control w-full">
          <label class="label" for="password">
            <span class="label-text font-medium">Password</span>
          </label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="la tua password"
            autocomplete="current-password"
            class="input input-bordered w-full"
          />
        </div>

        @if (errorMessage) {
          <div class="alert alert-error text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>{{ errorMessage }}</span>
          </div>
        }

        <button
          type="submit"
          class="btn btn-primary w-full"
          [disabled]="form.invalid || loading"
        >
          @if (loading) {
            <span class="loading loading-spinner loading-sm"></span>
          }
          {{ loading ? 'Accesso in corso...' : 'Accedi' }}
        </button>

        <p class="text-center text-sm text-base-content/60">
          Non hai un account?
          <a routerLink="/register" class="link link-primary font-medium">Registrati</a>
        </p>
      </form>
    </div>
  </div>
</div>
