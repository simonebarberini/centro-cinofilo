<div class="min-h-screen flex items-center justify-center bg-base-200 px-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">

      @if (!submitted) {
        <div class="text-center mb-4">
          <h2 class="text-2xl font-bold text-primary">Password dimenticata</h2>
          <p class="text-sm text-base-content/60 mt-1">
            Inserisci la tua email e lo slug del centro per ricevere le istruzioni.
          </p>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
          <div class="form-control">
            <label class="label" for="fp-email">
              <span class="label-text font-medium">Email</span>
            </label>
            <input
              id="fp-email"
              type="email"
              formControlName="email"
              placeholder="email@esempio.it"
              autocomplete="email"
              class="input input-bordered w-full"
            />
          </div>

          <div class="form-control">
            <label class="label" for="fp-slug">
              <span class="label-text font-medium">Slug del centro</span>
            </label>
            <input
              id="fp-slug"
              type="text"
              formControlName="tenantSlug"
              placeholder="es. il-mio-centro"
              class="input input-bordered w-full"
            />
          </div>

          <button
            type="submit"
            class="btn btn-primary w-full"
            [disabled]="form.invalid || loading"
          >
            @if (loading) {
              <span class="loading loading-spinner loading-sm"></span>
            }
            Invia istruzioni
          </button>

          <p class="text-center text-sm text-base-content/60">
            <a routerLink="/login" class="link link-primary">Torna al login</a>
          </p>
        </form>
      }

      @if (submitted) {
        <div class="text-center">
          <div class="text-5xl mb-4">📨</div>
          <h2 class="text-xl font-bold text-primary mb-2">Controlla la tua email</h2>
          <p class="text-base-content/70 mb-6">
            Se esiste un account con questa email, riceverai a breve le istruzioni per reimpostare la password.
          </p>
          <a routerLink="/login" class="btn btn-primary w-full">Torna al login</a>
        </div>
      }

    </div>
  </div>
</div>
