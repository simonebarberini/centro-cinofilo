<div class="p-4 md:p-6">
  <div *ngIf="loading" class="flex justify-center py-12">
    <span class="loading loading-spinner loading-lg text-primary"></span>
  </div>

  <div *ngIf="error" class="alert alert-error mb-4">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span>{{ error }}</span>
    <button class="btn btn-sm btn-ghost" (click)="loadTenant()">Riprova</button>
  </div>

  <ng-container *ngIf="!loading && !error && tenant">
    <div class="mb-6">
      <h1 class="text-2xl font-bold">{{ tenant.name }}</h1>
      <p class="text-base-content/60 text-sm">{{ tenant.slug }}</p>
    </div>

    <div role="tablist" class="tabs tabs-bordered mb-6">
      <a role="tab" class="tab" routerLink="info" routerLinkActive="tab-active">Info</a>
      <a role="tab" class="tab" routerLink="modules" routerLinkActive="tab-active">Moduli</a>
    </div>

    <router-outlet></router-outlet>
  </ng-container>
</div>
