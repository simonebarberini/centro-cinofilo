<div class="p-4 md:p-6">
  <div class="flex items-center justify-between mb-6 gap-4 flex-wrap">
    <h1 class="text-2xl font-bold">Tenant</h1>
    <input
      type="text"
      class="input input-bordered w-full max-w-xs"
      placeholder="Cerca per nome o slug..."
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange()"
    />
  </div>

  <div *ngIf="loading" class="flex justify-center py-12">
    <span class="loading loading-spinner loading-lg text-primary"></span>
  </div>

  <div *ngIf="error" class="alert alert-error mb-4">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span>{{ error }}</span>
  </div>

  <div *ngIf="!loading && !error && tenants.length === 0" class="card bg-base-200 p-12 text-center">
    <div class="text-5xl mb-4">🏢</div>
    <h2 class="text-xl font-semibold mb-2">Nessun tenant trovato</h2>
    <p class="text-base-content/60">Prova a modificare i criteri di ricerca.</p>
  </div>

  <div *ngIf="!loading && !error && tenants.length > 0" class="card bg-base-100 shadow-sm overflow-x-auto">
    <table class="table table-zebra">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Slug</th>
          <th>Tipo</th>
          <th>Capacità box</th>
          <th>Data creazione</th>
          <th class="text-right">Azioni</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of tenants">
          <td class="font-medium">{{ t.name }}</td>
          <td><code class="text-sm">{{ t.slug }}</code></td>
          <td>{{ t.type }}</td>
          <td>{{ t.capacityBoxes }}</td>
          <td>{{ t.createdAt | date:'dd/MM/yyyy' }}</td>
          <td class="text-right">
            <button class="btn btn-ghost btn-sm" (click)="openTenant(t)">Apri</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
