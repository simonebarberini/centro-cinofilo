server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ──────────────────────────────────────────────────────────────────────
    # Security headers — SPA responses only.
    # Ownership split: Nginx owns the headers for the Angular SPA (the HTML
    # shell and the static assets); the Spring backend owns the headers for
    # /api responses. These directives are therefore intentionally NOT applied
    # to the /api/ location. Content-Security-Policy and Strict-Transport-
    # Security are deliberately deferred until the deploy architecture and TLS
    # termination are finalized.
    # ──────────────────────────────────────────────────────────────────────

    # ── SPA fallback (HTML shell) ─────────────────────
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        # index.html must never be cached, so clients always pick up new app builds.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # ── Reverse-proxy to backend (/api) ───────────────
    # No security headers added here: the Spring backend owns API response headers.
    # `^~` makes this prefix win over the static-asset regex below, so an API path
    # ending in .js/.css/etc. can never be captured by the SPA static location
    # (which would otherwise apply SPA headers and break the ownership split).
    location ^~ /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ── Caching static assets (hashed, immutable) ─────
    location ~* \.(?:js|css|woff2?|ttf|ico|svg|png|jpg|jpeg|gif)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        expires 6M;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ── Gzip ──────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
