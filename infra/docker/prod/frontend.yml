# ── Produzione – Frontend (Angular + Nginx) ───────────────────────────────────
# Richiede il servizio 'backend' attivo (backend.yml).
# Avviare sempre insieme a db.yml e backend.yml (vedi .env.prod.example).
# ─────────────────────────────────────────────────────────────────────────────

services:
  frontend:
    build:
      context: ../../../frontend
      dockerfile: Dockerfile
    container_name: cinofilo-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge
