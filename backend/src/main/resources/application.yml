spring:
  application:
    name: centro-cinofilo-backend
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cinofilo}
    username: ${DB_USER:cinofilo}
    password: ${DB_PASSWORD:cinofilo}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-description: "Initial baseline"
    baseline-version: 0
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

# JWT — JWT_SECRET is mandatory, no default. Application refuses to start if missing or too short.
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}

logging:
  level:
    root: INFO
    it.cinofilo: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

app:
  base-url: ${APP_BASE_URL:http://localhost:4200}
  cors:
    # Supports comma-separated values via env var: CORS_ALLOWED_ORIGINS=https://a.com,https://b.com
    # In production set CORS_ALLOWED_ORIGINS to the real frontend domain.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ── Rate limiting ──────────────────────────────────────────────────────────────
# Set "enabled: false" to disable globally (e.g. in integration tests via DynamicPropertySource).
# Limits are intentionally conservative for production. Tune per-policy as needed.
# Dual-bucket pattern: requests are blocked if ANY bucket is exhausted.
#   Bucket 1 (IP_TENANT)      — blocks concentrated attacks from one network on one tenant
#   Bucket 2 (TENANT_USERNAME / TENANT_EMAIL) — blocks distributed attacks on one account
rate-limit:
  enabled: true
  endpoint-policies:
    "[/auth/login]": LOGIN
    "[/auth/register]": REGISTER
    "[/auth/forgot-password]": FORGOT_PASSWORD
    "[/auth/resend-verification]": RESEND_VERIFICATION
    "[/auth/reset-password]": RESET_PASSWORD

  policies:
    LOGIN:
      buckets:
        - key-type: IP_TENANT
          capacity: 20
          refill-tokens: 20
          refill-period-minutes: 15
        - key-type: TENANT_USERNAME
          capacity: 10
          refill-tokens: 10
          refill-period-minutes: 15

    REGISTER:
      buckets:
        - key-type: IP
          capacity: 3
          refill-tokens: 3
          refill-period-minutes: 60

    FORGOT_PASSWORD:
      buckets:
        - key-type: IP_TENANT
          capacity: 5
          refill-tokens: 5
          refill-period-minutes: 60
        - key-type: TENANT_EMAIL
          capacity: 3
          refill-tokens: 3
          refill-period-minutes: 60

    RESEND_VERIFICATION:
      buckets:
        - key-type: IP_TENANT
          capacity: 5
          refill-tokens: 5
          refill-period-minutes: 60
        - key-type: TENANT_EMAIL
          capacity: 3
          refill-tokens: 3
          refill-period-minutes: 60

    RESET_PASSWORD:
      buckets:
        - key-type: IP
          capacity: 10
          refill-tokens: 10
          refill-period-minutes: 60
