<dialog class="modal modal-open">
  <div class="modal-box w-11/12 max-w-lg">
    <h3 class="font-bold text-lg mb-4">{{ isEditMode ? 'Modifica prenotazione' : 'Nuova prenotazione' }}</h3>

    <!-- Server Error -->
    <div *ngIf="serverError" class="alert alert-error mb-4 text-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>{{ serverError }}</span>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <!-- Cliente -->
      <div class="form-control">
        <label class="label"><span class="label-text">Cliente *</span></label>
        <select formControlName="customerId" class="select select-bordered"
                [class.select-error]="isInvalid('customerId')"
                [attr.disabled]="isEditMode ? '' : null">
          <option value="">Seleziona cliente...</option>
          <option *ngFor="let c of customers" [value]="c.id">
            {{ c.firstName }} {{ c.lastName }}{{ c.phone ? ' — ' + c.phone : '' }}
          </option>
        </select>
        <label class="label" *ngIf="isInvalid('customerId')">
          <span class="label-text-alt text-error">Seleziona un cliente</span>
        </label>
      </div>

      <!-- Cane (cascading) -->
      <div class="form-control mt-4">
        <label class="label"><span class="label-text">Cane *</span></label>
        <select formControlName="dogId" class="select select-bordered"
                [class.select-error]="isInvalid('dogId')"
                [attr.disabled]="(isEditMode || !form.get('customerId')?.value) ? '' : null">
          <option value="">
            {{ loadingDogs ? 'Caricamento...' : (dogs.length === 0 && form.get('customerId')?.value ? 'Nessun cane per questo cliente' : 'Seleziona cane...') }}
          </option>
          <option *ngFor="let d of dogs" [value]="d.id">
            {{ d.name }}{{ d.breed ? ' (' + d.breed + ')' : '' }}
          </option>
        </select>
        <label class="label" *ngIf="isInvalid('dogId')">
          <span class="label-text-alt text-error">Seleziona un cane</span>
        </label>
      </div>

      <!-- Date -->
      <div class="grid grid-cols-2 gap-4 mt-4">
        <div class="form-control">
          <label class="label"><span class="label-text">Check-in *</span></label>
          <input type="date" formControlName="startDate" class="input input-bordered"
                 [class.input-error]="isInvalid('startDate')" />
          <label class="label" *ngIf="isInvalid('startDate')">
            <span class="label-text-alt text-error">Obbligatorio</span>
          </label>
        </div>
        <div class="form-control">
          <label class="label"><span class="label-text">Check-out *</span></label>
          <input type="date" formControlName="endDate" class="input input-bordered"
                 [class.input-error]="isInvalid('endDate')" />
          <label class="label" *ngIf="isInvalid('endDate')">
            <span class="label-text-alt text-error">Obbligatorio</span>
          </label>
        </div>
      </div>

      <!-- Availability indicator -->
      <div class="mt-3" *ngIf="checkingAvailability">
        <span class="loading loading-spinner loading-xs text-primary mr-1"></span>
        <span class="text-sm text-base-content/60">Verifica disponibilità…</span>
      </div>

      <div class="mt-3" *ngIf="availabilityError">
        <span class="text-sm text-warning">⚠ {{ availabilityError }}</span>
      </div>

      <div class="mt-3" *ngIf="!checkingAvailability && availability.length > 0">
        <div *ngIf="!hasUnavailableDays" class="text-sm text-success flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
          Disponibilità confermata per tutte le date.
        </div>

        <div *ngIf="hasUnavailableDays" class="text-sm text-error">
          <p class="font-medium mb-1">⚠ Alcune date non sono disponibili:</p>
          <div class="max-h-32 overflow-y-auto">
            <div *ngFor="let day of availability" class="flex justify-between text-xs py-0.5 px-2 rounded"
                 [ngClass]="{ 'bg-error/10': day.available <= 0 }">
              <span>{{ day.date }}</span>
              <span>{{ day.available }}/{{ day.capacity }} posti</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Notes -->
      <div class="form-control mt-4">
        <label class="label"><span class="label-text">Note</span></label>
        <textarea formControlName="notes" class="textarea textarea-bordered" rows="3"
                  placeholder="Note aggiuntive..."></textarea>
      </div>

      <!-- Actions -->
      <div class="modal-action">
        <button type="button" class="btn" (click)="cancel()">Annulla</button>
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          <span *ngIf="saving" class="loading loading-spinner loading-sm"></span>
          {{ isEditMode ? 'Salva' : 'Crea' }}
        </button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop" (click)="cancel()">
    <button>chiudi</button>
  </form>
</dialog>
