<div>
  <div *ngIf="loading" class="flex justify-center py-12">
    <span class="loading loading-spinner loading-lg text-primary"></span>
  </div>

  <div *ngIf="error" class="alert alert-error mb-4">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span>{{ error }}</span>
    <button class="btn btn-sm btn-ghost" (click)="loadAll()">Riprova</button>
  </div>

  <div *ngIf="!loading && !error" class="card bg-base-100 shadow-sm overflow-x-auto">
    <table class="table table-zebra">
      <thead>
        <tr>
          <th>Modulo</th>
          <th>Tipo</th>
          <th>Stato tenant</th>
          <th>Scadenza trial</th>
          <th class="text-right">Azioni</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of viewModel">
          <td>
            <div class="font-medium">{{ m.name }}</div>
            <div class="text-xs text-base-content/60"><code>{{ m.moduleKey }}</code></div>
          </td>
          <td>{{ m.type }}</td>
          <td>
            <span
              class="badge"
              [ngClass]="{
                'badge-success': m.tenantStatus === 'ACTIVE',
                'badge-warning': m.tenantStatus === 'TRIAL',
                'badge-error': m.tenantStatus === 'CANCELLED',
                'badge-ghost': m.tenantStatus === null
              }"
            >{{ m.tenantStatus ?? 'NON ATTIVO' }}</span>
          </td>
          <td>{{ m.trialEndsAt ? (m.trialEndsAt | date:'dd/MM/yyyy') : '—' }}</td>
          <td class="text-right">
            <button
              *ngIf="m.tenantStatus !== 'ACTIVE' && m.tenantStatus !== 'TRIAL'"
              class="btn btn-sm btn-primary"
              [disabled]="pendingModuleKey === m.moduleKey"
              (click)="grant(m.moduleKey)"
            >Attiva</button>
            <button
              *ngIf="m.tenantStatus === 'ACTIVE' || m.tenantStatus === 'TRIAL'"
              class="btn btn-sm btn-outline btn-error"
              [disabled]="pendingModuleKey === m.moduleKey"
              (click)="cancel(m.moduleKey)"
            >Disattiva</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
