# ── Produzione – PostgreSQL ───────────────────────────────────────────────────
# Avvio standalone (solo DB):
#   docker compose --env-file .env.prod -f infra/docker/prod/db.yml up -d
#
# Normalmente avviato insieme agli altri servizi (vedi .env.prod.example).
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: cinofilo-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  app-net:
    driver: bridge
