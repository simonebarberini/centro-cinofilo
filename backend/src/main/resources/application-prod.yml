# ── Production profile ────────────────────────────────────────────────────────
# Inherits from application.yml. All sensitive values must come from env vars.
#
# Required env vars in production:
#   JWT_SECRET              — at least 64 bytes (512 bits) for HS512, generated with: openssl rand -hex 64
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
#   MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM
#   APP_BASE_URL            — public URL of the frontend (e.g. https://app.centrocinofilo.it)
#   CORS_ALLOWED_ORIGINS    — comma-separated list of allowed frontend origins
#   PLATFORM_ADMIN_USERNAME, PLATFORM_ADMIN_EMAIL, PLATFORM_ADMIN_PASSWORD
#                           — credentials for the single ADMIN_APP bootstrap user (see ADR-017)
# ──────────────────────────────────────────────────────────────────────────────

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    clean-disabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    root: INFO
    it.cinofilo: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  mail:
    from: ${MAIL_FROM}
