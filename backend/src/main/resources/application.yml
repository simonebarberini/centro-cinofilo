spring:
  application:
    name: centro-cinofilo-backend
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cinofilo}
    username: ${DB_USER:cinofilo}
    password: ${DB_PASSWORD:cinofilo}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-description: "Initial baseline"
    baseline-version: 0
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dev-secret-key-minimum-256-bits-for-hs256-algorithm-change-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000} # 8 hours

logging:
  level:
    root: INFO
    it.cinofilo: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
